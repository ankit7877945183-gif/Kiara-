<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Princess 🌸</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family: 'Arial', sans-serif;
  background: radial-gradient(circle at top, #ffd6ec, #ffeef6);
}

/* Floating text */
.text{
  position:absolute;
  font-size:20px;
  color:#ff4d88;
  font-weight:bold;
  white-space:nowrap;
  text-shadow: 0 0 10px rgba(255,77,136,0.6);
  animation: floatUp linear infinite;
}

@keyframes floatUp{
  from { transform: translateY(110vh); opacity:1; }
  to { transform: translateY(-20vh); opacity:0; }
}

/* Center start button */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

button{
  background:#ff4d88;
  color:white;
  border:none;
  padding:12px 22px;
  border-radius:10px;
  font-size:16px;
}
</style>
</head>

<body>

<div class="center">
  <button onclick="startMagic()">Tap for Magic 💖</button>
</div>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_5bbd14b9b0.mp3" type="audio/mpeg">
</audio>

<script>
const lines = [
"I am always available for you, my princess…",
"You can count on me…",
"Whatever you need, just order 😊🌸☘️",
"Forever here for you 💖"
];

function startMagic(){
  document.getElementById("bgMusic").play();
  document.querySelector(".center").style.display="none";
}

/* Create floating sentences */
function createText(){
  const span=document.createElement("span");
  span.className="text";
  span.innerText = lines[Math.floor(Math.random()*lines.length)];
  span.style.left = Math.random()*90 + "vw";
  span.style.animationDuration = (Math.random()*10 + 8) + "s";
  document.body.appendChild(span);
  setTimeout(()=>span.remove(),15000);
}

setInterval(createText,900);
</script>

</body>
</html>
