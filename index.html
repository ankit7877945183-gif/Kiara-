<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Princess 🌸</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family: 'Arial', sans-serif;
  background: radial-gradient(circle at top, #ffd6ec, #ffeef6);
}

/* Floating Text Style */
.text{
  position:absolute;
  font-size:20px;
  color:#ff4d88;
  font-weight:bold;
  white-space:nowrap;
  animation: floatText linear infinite;
  text-shadow: 0 0 10px rgba(255,77,136,0.5);
}

@keyframes floatText{
  from { transform: translateY(110vh); opacity:1; }
  to { transform: translateY(-20vh); opacity:0; }
}

/* Center Message */
.centerMsg{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  color:#d63384;
}

button{
  background:#ff4d88;
  color:white;
  border:none;
  padding:12px 22px;
  border-radius:10px;
  font-size:16px;
  margin-top:20px;
}
</style>
</head>

<body>

<!-- CENTER MESSAGE -->
<div class="centerMsg">
  <h2>Hey My Princess 🌸☘️</h2>
  <button onclick="startMusic()">Tap for Magic 💖</button>
</div>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_5bbd14b9b0.mp3" type="audio/mpeg">
</audio>

<script>
function startMusic(){
  document.getElementById("bgMusic").play();
}

/* Floating Sentences */
const sentence = "I am always available for you my princess 🌸☘️ so whatever you need just order ☺️";

function createText(){
  const span=document.createElement("span");
  span.className="text";
  span.innerText=sentence;
  span.style.left=Math.random()*100+"vw";
  span.style.animationDuration=(Math.random()*10+8)+"s";
  document.body.appendChild(span);
  setTimeout(()=>span.remove(),15000);
}

setInterval(createText,800);
</script>

</body>
</html>
