<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Princess 🌸</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#ffd6ec,#ffeef6);
  text-align:center;
}

/* Container fix */
.wrapper{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

/* Card */
.box{
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 15px 35px rgba(0,0,0,0.2);
  max-width:350px;
  width:100%;
}

h1{color:#ff4d88}
p{font-size:18px;color:#444;margin-bottom:20px}

button{
  background:#ff4d88;
  color:white;
  border:none;
  padding:12px 22px;
  border-radius:10px;
  font-size:16px;
}

/* Hearts */
.heart{
  position:fixed;
  bottom:-20px;
  color:#ff4d88;
  animation:floatUp 6s linear infinite;
}

@keyframes floatUp{
  to{transform:translateY(-110vh);opacity:0}
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="box">
    <h1>Hey My Princess 🌸☘️</h1>
    <p>
      I am always available for you my princess 🌸☘️ <br>
      so whatever you need just order ☺️
    </p>
    <button onclick="playMusic()">Always Here 💖</button>
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_5bbd14b9b0.mp3" type="audio/mpeg">
</audio>

<script>
function playMusic(){
  document.getElementById("bgMusic").play();
}

setInterval(()=>{
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="💖";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(Math.random()*20+15)+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
},500);
</script>

</body>
</html>
